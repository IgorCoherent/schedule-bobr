[project]
name = "schedule-bobr"
version = "1.5.0"
description = "Дежурства — расписание кассиров и техничек"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "jinja2>=3.1.4",
    "bcrypt>=4.2.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
