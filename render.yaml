services:
  - type: web
    name: schedule-bobr
    plan: free
    runtime: python
    rootDir: .
    buildCommand: pip install uv && uv sync --frozen
    startCommand: sh scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: schedule-bobr-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_START
        value: "true"
      - key: BOOTSTRAP_ON_START
        value: "false"
databases:
  - name: schedule-bobr-db
    plan: free
